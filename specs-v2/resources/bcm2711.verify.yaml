  legacy-dma-reaches-1-gb-at-a-time:
    basis: 5f7b1958b5662c0e86b11b6bac197aa4dd1419d401d6c595e4c389dbd11e34e1
    verdict: PASS
    date: '2026-10-08'
    verifier: Claude Opus 5.5, Claude Code subagent (delta of 90b3562 against the e7529fe record,
      itself a delta of e7529fe against the 6d3790f record; second reader run separately)
    note: 'the window is moved with "the PAGE or

      PAGELITE bits" (§1.2.4, p. 6). ENABLE.PAGE (27:24) sets the 1 GB page for "the 30-bit DMA

      engines (DMA0-6)" and PAGELITE (31:28) for "the DMA Lite engines (DMA7-10)" (Table 62, p. 60),

      one field per group, so the setting is shared across the group. The L2 aliases at 0x0 and

      0x8000_0000 "can''t be moved, and are limited to the first 1GB of SDRAM" (§1.2.4, p. 6). The

      earlier FAIL is resolved.'
    carried_from:
      repo: hardware-specs-docs
      commit: 69228ccbad909c7686039f1b8c190eb3620b8bc5
      path: specs/resources/bcm2711.verify.md
      key: Gotchas/5 "Legacy DMA reaches 1 GB at a time."
      format: 1
