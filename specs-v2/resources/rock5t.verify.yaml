    note: 'Mode: full reading. Gap fact. The TODO (transmit a byte at kernel entry with no setup and
      watch the header, then read back the pin-multiplexing and divisor registers, once under the
      stock loader and once under mainline U-Boot) can observe pin mux, running baud clock and divisor,
      and correctly separates stock from mainline. Read for contrary evidence: the Radxa serial page
      says the default Rockchip console is 1500000 8N1, which concerns the loader''s own console,
      not the state at kernel entry. Contrary evidence for a supported value was not checked because
      there is none. Citation precision is imprecise because nothing is cited.'
