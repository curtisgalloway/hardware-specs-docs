        Reading the divisor needs LCR.DLAB set, a line-control write the DesignWare UART may reject
        while busy; the method should drain the transmitter first. Precision imprecise and contrary
        evidence not checked (no citation).
  mainline-boot-chain:
    basis: abad0a2e6fd2b55c2035c65f3b01d86685dc0874460ccf34ee67ec470dc5e9ca
    verdict: PASS
    date: '2026-10-09'
    verifier: Claude Code, claude-sonnet-5-5, reader rock5t-r2-primary-docs
    note: 'Mode: full reading. U-Boot Rockchip documentation at the pin: the rk3588 board list contains
      ''Radxa ROCK 5B/5B+/5T (rock5b-rk3588)''; Building/TF-A says TF-A is required for ARM64 images
      and to use Rockchip''s BL31 binary from rkbin where TF-A is unavailable (the rk3588 example
      sets BL31 to an rkbin file); Building/TPL says to use Rockchip''s rkbin DDR binary as ROCKCHIP_TPL
      where U-Boot lacks DRAM init (the rk3588 example sets it); Flashing, Package the image with
      U-Boot TPL/SPL, says to dd u-boot-rockchip.bin at seek=64 for SD and to write u-boot-rockchip-spi.bin
      to offset 0 of SPI flash. The claim''s conditional wording matches. Searched the rest of the
      page, including the miniloader alternative and the eMMC fastboot section, for qualifications
      on rk3588; none. TODO (confirm stages on a mainline console) can observe what the page leaves
      unstated.'
    contrary_evidence: none-found
    citation_precision: exact
  kernel-entry-contract:
    basis: 025acd83584a31ce95d49c7bbf4aeed9829e1d0b966465203694351f7d3e7ef2
    verdict: PASS
    date: 2026-10-09
    verifier: Claude Code, claude-sonnet-5-5, reader rock5t-primary-docs-rock5t
    note: 'Documentation/arch/arm64/booting.rst at the pinned commit, section "4. Call the kernel
      image", "Before jumping into the kernel" list: x0 = physical address of the dtb, x1 to x3 =
      0, all of PSTATE.DAIF masked, non-secure EL2 (RECOMMENDED) or EL1, MMU off, CNTFRQ programmed
      and CNTVOFF consistent on all CPUs. The claim matches. Qualifiers the claim leaves out but does
      not contradict: the register settings are for the primary CPU, and entering at EL1 requires
      CNTHCTL_EL2.EL1PCTEN set where available. Contrary search of the rest of the file (cache and
      coherency conditions, versions prior to v4.x notes) found nothing that changes the listed values.
      The "not stated" half is an absence claim about the documents read, consistent with the TODO;
      reading CurrentEL from the kernel shim under each loader is a method that can observe the question.'
    contrary_evidence: none-found
    citation_precision: exact
    readers:
    - verifier: Claude Code, claude-opus-5-5, reader rock5t-second-docs
      verdict: PASS
      date: 2026-10-09
      note: 'linux-booting at 8d3ae592, section 4 Call the kernel image: x0 = dtb physical address,
        x1-x3 = 0, PSTATE.DAIF all masked, non-secure EL2 (RECOMMENDED) or EL1, MMU off, CNTFRQ programmed
        and CNTVOFF consistent on all CPUs. The claim is a subset: the section also requires DMA quiesced,
        image cleaned to PoC, coherency and system-register initialization (SCR_EL3.HCE at EL2, CNTHCTL_EL2.EL1PCTEN
        at EL1); the claim does not say its list is complete, but an author may want "among other
        conditions". The ROCK 5T part (EL not stated) matches the documents read. TODO (read CurrentEL)
        can settle it. Contrary-evidence search over the whole of section 4 and section 1-3: none
        found. Citation precision exact.'
  kernel-image-format:
    basis: 7005ce56cff1e17780acb9a35eb17a127be6b3648ef00ee930b61abe31f5fb74
    verdict: PASS
    date: 2026-10-09
    verifier: Claude Code, claude-sonnet-5-5, reader rock5t-primary-docs-rock5t
    note: 'doc/usage/cmd/booti.rst at the pin, Description: booti boots a flat or compressed Image;
      "addr ... defaults to CONFIG_SYS_LOAD_ADDR"; compressed images need kernel_comp_addr_r and kernel_comp_size.
      booting.rst section 2: dtb on an 8-byte boundary, not exceeding 2 megabytes. Section 4: the
      Image must be placed text_offset bytes from a 2MB aligned base in usable RAM with at least image_size
      bytes free. All values in the claim match. Contrary search: the booti example log shows U-Boot
      moving the Image to its text_offset position itself (so the loader need not pre-place it), kernel_comp_size
      has a 10x decompressed limit, and booting.rst says image_size 0 (older kernels) means text_offset
      0x80000; none contradicts the stated requirements. Scope caveat: booti.rst is U-Boot v2026.10
      (mainline) and the stock loader is a 2017.09 vendor build, so the environment variables and
      defaults are not established for the stock loader; the claim says "U-Boot''s booti" without
      a version, and the TODO (print the stock environment) is the right method.'
    contrary_evidence: found
    citation_precision: exact
    readers:
    - verifier: Claude Code, claude-opus-5-5, reader rock5t-second-docs
      verdict: PASS
      date: 2026-10-09
      note: 'uboot-docs-booti (v2026.10) Description: flat or compressed Image; compressed needs kernel_comp_addr_r
        and kernel_comp_size; addr defaults to CONFIG_SYS_LOAD_ADDR. linux-booting section 4: Image
        placed text_offset bytes from a 2 MB aligned base in usable RAM, at least image_size bytes
        free; section 2: dtb 8-byte aligned, at most 2 MB. Contrary-evidence search: the booti page
        documents mainline U-Boot v2026.10, while the stock loader is reported elsewhere in this spec
        to be a 2017.09-based vendor build, so the compressed-Image path describes mainline booti
        and may not hold for the stock loader; the claim should scope "U-Boot''s booti" to mainline.
        No conflicting statement found in the cited documents. Citation precision exact.'
  ram-options:
    basis: 96f57c00758dfec1d3668174aa5ec74f71142a28299761b79c52656aff300fd1
    verdict: PASS
    date: 2026-10-09
    verifier: Claude Code, claude-sonnet-5-5, reader rock5t-primary-docs-rock5t
    note: 'Brief section 3.1 (p. 4): "64bit LPDDR5 RAM options: 4GB, 8GB, 16GB, 24GB, 32GB"; section
      7 (p. 11) order codes D4, D8, D16, D24, D32. Schematic sheet 15 is titled LPDDR5_315P_2X32bit,
      shows two packages (CH0, CH1) with the device on the sheet labeled MT62F1G32D4DS-031 WT 4GB;
      block diagram sheet 3 labels DDR_CH0_32bit and DDR_CH1_32bit. That supports "two 32-bit channels"
      (64-bit total). Contrary search: the revision table says v1.4 "Update memory parameters", and
      the schematic sheet shows only the 4 GB part, so 8 to 32 GB rest on the brief; no document conflicts.
      Note the controller itself has 16-bit sub-channels (each package shows A and B halves), which
      the claim''s "two 32-bit channels" follows the schematic labels for.'
    contrary_evidence: none-found
    citation_precision: exact
