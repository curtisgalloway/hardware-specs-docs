    date: 2026-10-09
    verifier: Claude Code, claude-sonnet-5-5, reader rock5t-primary-docs-rock5t
    note: 'Product brief section 3.1 (p. 4, PDF sha256 matches the declared value) lists "Rockchip
      RK3588 / RK3588J SoC" and "Quad Cortex-A76 @ 2.2/2.4GHz and a quad Cortex-A55 @ 1.8GHz based
      on Arm DynamIQ configuration", which matches the claim. Searched the whole brief and the schematic
      (V1.2, block diagram sheet 3 and SoC sheets show plain RK3588) for a conflicting core count,
      clock or SoC grade; none. The brief does not say which SoC carries which clock; the claim keeps
      "or". The TODO method (read order information and industrial-variant documents) is workable:
      section 7 only maps J0 commercial and J1 industrial grade (-40 to 85 C) and never names RK3588J,
      so the question remains open.'
    contrary_evidence: none-found
    citation_precision: exact
  debug-console:
    basis: a680e2e30b1ba02653399f849666f427fc82abd37d6b1381f9e3f62825867fe0
    verdict: PASS
    date: 2026-10-09
    verifier: Claude Code, claude-sonnet-5-5, reader rock5t-primary-docs-rock5t
    note: 'Fetched the shared page at the pinned commit. Opening paragraph: pins 8 (TX) and 10 (RX)
      on the GPIO pins. Serial Connection table: GND pin 6, TX pin 8, RX pin 10 (the non-rock5itx,
      non-o6 branch). The ROCK 5T wrapper (rock5/rock5t/radxa-os/serial.md at the same commit) includes
      this page with platform "rk" and no model prop, so applicability of the model-conditioned pin
      table rests on the rendered page; the rendered ROCK 5T page shows the same pin 6/8/10 table
      (corroboration only, unpinned). Rockchip tip under Preparation: "1500000n8 without flow control";
      the CP210X/PL2303x baud-rate limits and FT232RL power issues are stated. Contrary search: FAQ
      says hardware flow control may be on by default and should be turned off, which agrees with
      "no flow control"; nothing else conflicts. "40-pin header" is from the brief and schematic,
      not this page (page says "GPIO pins"). The stop bit (the "1" in 8N1) is stated only under "Using
      Serial Tools" (stop bit: 1), which is not cited. To narrow the citation: Add {heading: Using
      Serial Tools} to the support anchors; the stop-bit value appears only there. Optionally cite
      the brief section 3.2 for the 40-pin header.'
    contrary_evidence: none-found
    citation_precision: imprecise
    readers:
    - verifier: Claude Code, claude-opus-5-5, reader rock5t-second-docs
      verdict: PASS
      date: 2026-10-09
      note: 'radxa-docs-serial read at commit 35413cf5: the opening paragraph names pins 8 (TX) and
        10 (RX); the Preparation tip gives 1500000n8 without flow control for Rockchip products and
        the CP210X/PL2303 baud and FT232RL power warnings; Serial Connection''s table gives GND pin
        6, TX pin 8, RX pin 10. The ROCK 5T wrapper (rock5/rock5t/radxa-os/serial.md at the same commit)
        imports this page with platform "rk". Contrary-evidence search: the schematic sheet 36 (40pin/LED/RTC/EEPROM)
        wires header pin 8 and 10 to UART2_TX_M0 and UART2_RX_M0 and pin 6 to ground, consistent;
        the header also carries UART2 M2 on pins 36/38 (product brief 6.1.1) but Radxa names pins
        8/10 as the console. None found. Citation precision exact.'
  uart2-state-at-handoff:
    basis: eec313134247beed7dbac994da3f4dd02c875f001cc0dd2ae1fc85ef5b8e0cc1
