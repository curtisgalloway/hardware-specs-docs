  maskrom-recovery:
    basis: cafaa3c5b06fe22853a01c93633049ab1855dc40c600efb92cfa9daba0ae0966
    verdict: PASS
    date: 2026-10-09
    verifier: Claude Code, claude-sonnet-5-5, reader rock5t-primary-docs-rock5t
    note: 'ROCK 5T Maskrom page at the pin (rock5/rock5t/low-level-dev/maskrom/linux.md), "Enter to
      Maskrom" filled by the ROCK 5T steps: remove the microSD card and power, hold the Maskrom button,
      insert the USB cable into the Type-C port with the other end to the computer, power on. The
      shared rkdeveloptool page: "Flash Loader" is rkdeveloptool db `<loader>` with loader rk3588_spl_loader_v1.08.111.bin,
      "Flash System Image" is wl 0 `<image>` after xz -d (uncompressed), "Reboot" is rkdeveloptool
      rd, and the tip says it cannot select a Maskrom device or the storage medium written to. All
      match. One wording point: the page says one device and one storage medium are normally connected,
      and the claim''s "the one storage device it finds" is a fair paraphrase. The page never says
      "sector"; wl 0 is the begin-sector argument of rkdeveloptool (not shown in the cited pages),
      so "from sector 0" rests on tool knowledge outside the citation. Contrary search: the page''s
      "this should normally put it into Maskrom mode" is the only hedge; no conflicting procedure
      found. To narrow the citation: Cite the rkdeveloptool usage text (wl `<BeginSec>` `<File>`)
      for the sector meaning, or write ''at address 0 as rkdeveloptool wl numbers it''.'
    contrary_evidence: none-found
    citation_precision: imprecise
  boot-storage:
    basis: f3a45a0b42a4295bee6ca41c7eabf8a5b13575f48b3bf3c60d6f056b29000250
    verdict: PASS
    date: 2026-10-09
    verifier: Claude Code, claude-sonnet-5-5, reader rock5t-r3-primary
    note: 'FULL reading of the reworded claim. Schematic V1.2 (hash matched) sheet 13 BOOT MODE CONFIG,
      Table 1: level 7 (R1511 100K pull-up, R1509 DNP, 1.8 V) reads ''FSPI M2 - FSPI M1 - FSPI M0
      - eMMC - SD Card - USB''; no NVMe or PCIe entry anywhere in the table, which is exactly what
      the revised wording asserts (the table does not list it; it does not assert the ROM never reads
      NVMe). Sheet 21: XT25F128BWOI/HGA on VCC_3V3_S3 with FSPI-CS0/D0-D3/CLK; BGA-153 eMMC with D0-D7,
      CMD, CLK, RST and DATA_STROBE (R138 22R). Sheet 9: eMMC and FSPI/SDMMC0 pad groups. Sheet 29:
      TF card J4 on SDMMC0 with SDMMC_DET_L. Sheet 24: two M.2 M-key sockets, ports 0 and 1, two lanes
      each (PCIE30_PORT0 lanes 0-1, PORT1 lanes 2-3). Brief 1.4 (hash matched) section 3.1 page 4:
      eMMC options 16 to 256 GB; section 3.2 page 5: micro SD slot, 2x M.2 M key PCIe 3.0 2-lane;
      section 7 page 11: E0 (not soldered), E16 to E128. All numbers and the three-of-four count follow.
      The #boot-order-strap relation agrees (same sheet 13 table). The TODO (SPI capacity from the
      XT25F128B datasheet, eMMC HS400 mode) names observable methods and the claim does not state
      those values. Contrary search: the brief also lists an M.2 B key (4G) slot, which is not storage
      and is not claimed; no source read shows the ROM reading PCIe.'
    contrary_evidence: none-found
    citation_precision: exact
    readers:
    - verifier: Claude Code, claude-opus-5-5, reader rock5t-r3-second
      verdict: PASS
      date: 2026-10-09
      note: 'FULL reading; document hashes match. Schematic sheet 13 BOOT MODE CONFIG table lists
        only FSPI M2/M1/M0, eMMC, SD card and USB (no PCIe), supporting both "the boot ROM reads three"
        (with #boot-order-strap, declared) and the revised NVMe wording. Sheet 21 (SPI/eMMC Flash):
        XT25F128BWOI on VCC_3V3_S3 with FSPI clock, chip select and D0-D3 nets; eMMC footprint EMMC_B153
        with eMMC_D0-D7 and eMMC_DATA_STROBE. Sheet 9: eMMC nets on the RK3588 EMMC controller bank
        and SDMMC0 data. Sheet 29: TF card on SDMMC0 with SDMMC_DET_L. Sheet 24: two M.2_NGFF_MKEY_SOCKET
        parts on PCIe 3.0 port 0 (lanes 0-1) and port 1 (lanes 2-3). Brief 3.1 (p4): eMMC 16 to 256
        GB; 3.2 (p5): microSD slot, two M.2 M-key PCIe 3.0 2-lane; section 7 (p11): E0 not soldered
        through E128. Contrary-evidence search: the boot-mode table''s other levels and the sheet
        3 block diagram; none found. TODO method can settle the remainder: sheet 3 states "eMMC 5.1
        HS400" and the XTX part number encodes 128 Mbit. Citation precision exact.'
