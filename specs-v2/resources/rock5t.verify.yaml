    note: 'Schematic sheet 13 (rendered, labeled BOOT MODE CONFIG): net BOOT_SARADC_IN0 is pulled
      to VCCA_1V8_S0 through R1511 (100K) with R1509 shown "DNP" to ground. TABLE 1 row LEVEL7: Rup
