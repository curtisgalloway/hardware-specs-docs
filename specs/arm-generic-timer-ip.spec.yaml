orientation: >-
  Terms: EL1 is exception level 1, the processor privilege level normally used by an operating-system kernel. A system register is accessed by processor instructions; MMIO means memory-mapped input/output. See the [hardware glossary](https://github.com/curtisgalloway/hardware-specs-docs/blob/main/GLOSSARY.md).
facts:
- id: architecture-identity
  section: standards
  title: Arm Generic Timer architecture
  claim: The Arm Generic Timer architecture provides a common System Counter and per-core comparator
    timers. EL1 physical and virtual timers are always present. This identity covers the processor
    timer interface, not external MMIO timer frames.
