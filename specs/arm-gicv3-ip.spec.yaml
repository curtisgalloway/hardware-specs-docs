orientation: >-
  Terms: GIC means Generic Interrupt Controller; SPI/PPI/SGI are shared peripheral, private peripheral and software-generated interrupts; PE means processing element. AArch64 is the Arm 64-bit execution state; a system register is accessed by processor instructions. See the [hardware glossary](https://github.com/curtisgalloway/hardware-specs-docs/blob/main/GLOSSARY.md).
facts:
- id: architecture-identity
  section: standards
  claim: The bounded programming model is GICv3 with affinity routing and the AArch64 CPU system
    register interface. Distributor state routes SPIs; redistributors hold SGI/PPI configuration;
    each CPU interface serves one processing element (PE). This identifies an interface, not a GIC-600
    product or revision.
