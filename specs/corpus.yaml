#
# Corpus ledger for hardware-specs-docs (driver-lab skills/spec-format/SKILL.md, "Corpus
# ledger"): every document and hardware block discovery found, each with a disposition. The
# document entries mirror the specs' resources.documents (name, access, sha256).
format: 2
derivation: >-
  Documents: every resources.documents entry of the five specs, plus the RK3588 brief
  datasheet the rk3588 block list is read from. Blocks are read from public documents only,
  never from a source tree. rk3588: one entry per block named in the block diagram on PDF
  page 2 of Rockchip's RK3588 Brief Datasheet (rk3588-brief-datasheet); cache sizes and the
  NPU's shared memory are folded into the cluster, GPU and NPU entries. bcm2711: one entry per
  peripheral in the section 1.1 list, the address-map figure (section 1.2.1) and chapters 2 to
  13 of BCM2711 ARM Peripherals (bcm2711-peripherals), with the VPU mailboxes the section 13.1
  note names. rock5t: one entry per device or connector in section 3 (Hardware and Interfaces)
  of the ROCK 5T Product Brief (rock5t-product-brief). The two ip specs (arm-generic-timer-ip,
  arm-gicv3-ip) each describe one architecture and list no blocks. A block a spec fact covers
  names it with a spec disposition; a fact that only records a gap leaves the block planned, with
  the fact in its note. Blocks outside boot bring-up (multimedia, audio, accelerators,
  security, coprocessors) are excluded; the rest are planned.
