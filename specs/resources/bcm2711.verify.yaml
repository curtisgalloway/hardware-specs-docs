        are RAZ/WI to Non-secure accesses (gicv2-spec 4.3.4, 4.3.5): a Non-secure kernel cannot enable
        or take an interrupt the stub left in Group 0. Three weaknesses, none making the method impossible
        (recommended, not a FAIL): (1) the decision rule leaves unclassified the outcome the documentation
        itself predicts, control prints and test prints nothing; given the same image and device tree,
        that should read as "does not support" (or be stated explicitly); (2) "the same GIC state"
        compares only Non-secure-banked views, since the stub''s group programming is invisible from
        Non-secure state; the method should say so, and the image should also print CurrentEL, because
        a run entered at EL3 (no stub effect) sees the Secure view and could enable and take a Group
        0 interrupt itself, falsely matching the control on "interrupt taken"; (3) the TODO text asks
        whether peripherals are "set up", but the image initializes UART0 itself, so the method observes
        only reachability of the peripherals; the text should say "reachable". Contrary-evidence search:
        all of rpi-docs at the pin for arm_peri_high / high peripheral / armstub (only config_txt/boot.adoc''s
        armstub section, which says the default stub is in firmware and selected by model and settings,
        with no high-mode statement); rpi-tools armstubs at 439b6198 builds an armstub8-gic-highperi
        variant and emits it into a generated armstubs.h table alongside the other stubs, which hints
        that a firmware-embedded high-mode stub may exist. This does not contradict the claim, which
        reports the documentation and disclaims current firmware, but it supports keeping that hedge
        and the hardware TODO.'
