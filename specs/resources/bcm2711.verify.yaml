verdicts:
  addressing-model:
    basis: bdb6cd64a8704e9266c360b47346c7b32b863049a2008ccc0204013123814bb9
    verdict: PASS
    date: '2026-10-08'
    verifier: Claude Opus 5.5, Claude Code subagent (delta of 90b3562 against the e7529fe record,
      itself a delta of e7529fe against the 6d3790f record; second reader run separately)
    note: '35-bit and legacy views, full-map Main and ARM Local

      ranges, Low Peripheral ranges, the 0x7Enn→0x4_7Enn/0x0_FEnn translation and UART0 at legacy

      0x7E20_1000 match §1.2.1–1.2.4 (pp. 4–6) and §11.5 (pp. 146–147). The GIC and ARM_LOCAL exceptions

      match §6.5.1–6.5.2 (p. 92).'
    carried_from:
      repo: hardware-specs-docs
      commit: 69228ccbad909c7686039f1b8c190eb3620b8bc5
      path: specs/resources/bcm2711.verify.md
      key: Quick-facts/1 "Addressing model"
      format: 1
    readers:
    - verifier: Claude Code, claude-opus-5-5, reader bcm2711-sf2-10b-second
      verdict: PASS
      date: '2026-10-09'
      note: 'BCM2711 ARM Peripherals (sha256 matched) 1.2.1 p4 names the Full 35-bit map, the 32-bit
        Legacy Master view (except large-address masters) and Low Peripheral mode; 1.2.2 p5 says the
        ARM CPU and DMA4 see the full map; p6 gives Main peripherals 0x4_7C00_0000-0x4_7FFF_FFFF,
        ARM Local 0x4_C000_0000-0x4_FFFF_FFFF and, when the VPU enables Low Peripheral mode, the ARM-only
        0x0_FC00_0000-0x0_FF7F_FFFF and 0x0_FF80_0000-0x0_FFFF_FFFF; 1.2.4 p6 states the document''s
        addresses are legacy and gives the 0x7Enn_nnnn -> 0x4_7Enn_nnnn / 0x0_FEnn_nnnn translation;
        6.5.1-6.5.2 p92 except GIC-400 and ARM_LOCAL as ARM-only; 11.5 p147 lists UART0 at 0x7e201000.
        Every value matches. Contrary search: Figure 1 p5 and chapters 4 and 6 for any other ARM-only
        or non-legacy address; none found.'
  dma-view-of-memory:
    basis: 29fa21399883ab4175a334a830594aac519a8f69f57c5a501ad8cb48bd328df1
    verdict: PASS
    date: '2026-10-08'
    verifier: Claude Opus 5.5, Claude Code subagent (delta of 90b3562 against the e7529fe record,
      itself a delta of e7529fe against the 6d3790f record; second reader run separately)
    note: 'legacy RAM window 0xC000_0000–0xFFFF_FFFF, movable

      with PAGE/PAGELITE, fixed L2 aliases at 0x0 and 0x8000_0000 limited to the first 1 GB, and

      peripherals at 0x7C00_0000–0x7FFF_FFFF (§1.2.4, p. 6). ENABLE.PAGE 27:24 (DMA0–6) and PAGELITE

      31:28 (DMA7–10) (Table 62, p. 60). DMA4 bypasses paging (§4.6, p. 64). Channel 15 at 0x7EE0_5000,

      VPU-only (§4.2, p. 31).'
    carried_from:
      repo: hardware-specs-docs
      commit: 69228ccbad909c7686039f1b8c190eb3620b8bc5
      path: specs/resources/bcm2711.verify.md
      key: Quick-facts/4 "DMA view of memory"
      format: 1
  stub-load-and-hand-off-words:
    basis: 7c849b6f710f2e0c4e72f86c1e60e925a23b24689c489eb61be8c659e71a6ff3
    verdict: PASS
    date: '2026-10-08'
    verifier: Claude Opus 5.5, Claude Code subagent (delta of 90b3562 against the e7529fe record,
      itself a delta of e7529fe against the 6d3790f record; second reader run separately)
    note: 'load to address 0, AArch64 EL3, magic value

      causing the kernel and DTB load addresses to be written near the start of memory: TF-A rpi4.rst

      "TF-A port design".'
    carried_from:
      repo: hardware-specs-docs
      commit: 69228ccbad909c7686039f1b8c190eb3620b8bc5
      path: specs/resources/bcm2711.verify.md
      key: Quick-facts/6 "Stub load and hand-off words"
      format: 1
    readers:
    - verifier: Claude Code, claude-opus-5-5, reader bcm2711-sf2-10b-second
      verdict: PASS
      date: '2026-10-09'
      note: 'TF-A docs/plat/rpi4.rst at 51035547, "TF-A port design": armstub8.bin or the armstub=
        file is loaded to the beginning of DRAM (address 0) and executed in AArch64 EL3; if the GPU
        firmware finds a magic value in the image it puts the kernel and DTB load addresses in memory
        locations near the beginning of memory where the stub picks them up. Matches. The document
        attributes the loading to bootcode.bin, which on Pi 4 is the EEPROM boot code; the claim''s
        "firmware" is fair. The TODO asks only for offsets, which the doc does not give. Contrary
        search: the rest of rpi4.rst and config.txt armstub heading; none found.'
  kernel-entry-contract-linux-s-requirements:
    basis: 68c6ee69f5d119e75617002adeb3ef54f3799da2edd4f4f9cb2e210e5473c88d
    verdict: PASS
    date: '2026-10-08'
    verifier: Claude Opus 5.5, Claude Code subagent (delta of 90b3562 against the e7529fe record,
      itself a delta of e7529fe against the 6d3790f record; second reader run separately)
    note: 'x0–x3, DAIF, MMU off, NS

      EL2/EL1, CNTFRQ/CNTVOFF, EL1PCTEN, DTB alignment and size, text_offset/image_size placement,
      DMA

      quiesce, PoC clean, coherency, same EL, SCR_EL3.FIQ and HCE all match booting.rst "Setup the

      device tree" and "Call the kernel image". booting.rst adds "where available" to EL1PCTEN, which

      changes nothing on a core that implements EL2.'
    carried_from:
      repo: hardware-specs-docs
      commit: 69228ccbad909c7686039f1b8c190eb3620b8bc5
      path: specs/resources/bcm2711.verify.md
      key: Quick-facts/7 "Kernel entry contract (Linux's requirements)"
      format: 1
    readers:
    - verifier: Claude Code, claude-opus-5-5, reader bcm2711-sf2-10b-second
      verdict: PASS
      date: '2026-10-09'
      note: 'booting.rst at Linux 8d3ae592: "2. Setup the device tree" (8-byte boundary, at most 2
        MB); "4. Call the kernel image" (Image at text_offset from a 2 MB aligned base, image_size
        bytes free, DMA quiesced, x0 = DTB physical address, x1-x3 = 0, DAIF masked, non-secure EL2
        recommended or EL1, MMU off, no stale I-cache entries, cleaned to PoC, CNTFRQ programmed,
        CNTVOFF consistent, EL1PCTEN on EL1 entry, same coherency domain, SCR_EL3.FIQ consistent and
        unchanged, SCR_EL3.HCE = 1 for EL2 entry) and the closing paragraph (all CPUs enter at the
        same exception level). All match; the claim drops "where available" from EL1PCTEN, harmless
        on the A72. Citation imprecise: "System registers" is a bullet label inside section 4, not
        a heading; cite section 4 with the bullet names. Contrary search: the rest of booting.rst
        for exceptions; none found.'
  interrupt-controller:
    basis: da13d9e1480cea6996f3ffa5ac96d99efc469735ab49fc2b5bf831493d820c48
    verdict: PASS
    date: '2026-10-08'
    verifier: Claude Opus 5.5, Claude Code subagent (delta of 90b3562 against the e7529fe record,
      itself a delta of e7529fe against the 6d3790f record; second reader run separately)
    note: 'GIC-400 selected by default and the legacy

      controller selectable from config.txt (§6.1, p. 85; §6.3, p. 89; `enable_gic` on the legacy

      boot options page, default 1). Base 0x4_C004_0000 / 0xFF84_0000 and NUM_CPUS=4, NUM_SPIS=192

      (§6.5.1, p. 92). Distributor +0x1000, CPU interfaces +0x2000–0x3FFF, virtual interface control

      +0x4000–0x5FFF, virtual CPU interfaces +0x6000–0x7FFF (GIC-400 TRM §3.2 Table 3-1, p. 3-3);
      the

      derived Low Peripheral and full-map addresses are the base plus those offsets. GICv2 compliance

      and the GICv2 Security Extensions are now located at GIC-400 TRM §1.2 "Compliance" (p. 1-4),

      with §1.1 (p. 1-2) naming both extensions. IHI 0048B chapter 3 is "Interrupt Handling and

      Prioritization" and chapter 4 "Programmers'' Model". The earlier missing-locator FAIL is

      resolved.'
    carried_from:
      repo: hardware-specs-docs
      commit: 69228ccbad909c7686039f1b8c190eb3620b8bc5
      path: specs/resources/bcm2711.verify.md
      key: Quick-facts/11 "Interrupt controller"
