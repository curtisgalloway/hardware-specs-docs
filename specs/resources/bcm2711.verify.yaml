  addressing-model:
    basis: bdb6cd64a8704e9266c360b47346c7b32b863049a2008ccc0204013123814bb9
    verdict: PASS
    date: '2026-10-14'
    verifier: Claude Code subagent, claude-opus-5-5, Claude Code, session docs-p1
    note: 'Datasheet 1.2.1 (p4) names the full 35-bit bus and the 32-bit legacy master view and Low
      Peripheral mode; 1.2.2 (p5) says the full map is seen by large-address masters such as the DMA4
      engines and by the Arm CPU; p6 gives Main peripherals 0x4_7C00_0000-0x4_7FFF_FFFF, ARM Local
      0x4_C000_0000-0x4_FFFF_FFFF, and in Low Peripheral mode (enabled by the VPU) for the Arm only
      0x0_FC00_0000-0x0_FF7F_FFFF and 0x0_FF80_0000-0x0_FFFF_FFFF; 1.2.4 (p6) states the document''s
      addresses are legacy master addresses and gives the 0x7Enn_nnnn -> 0x4_7Enn_nnnn / 0x0_FEnn_nnnn
      translation. 6.5.1/6.5.2 (p92) mark GIC-400 and ARM_LOCAL bases as Arm-only, not legacy, addresses.
      11.5 (pp146-147) gives UART0 at 0x7e201000, which translates to 0x0_FE20_1000. Contrary search:
      grepped the whole datasheet text for other non-legacy or 0x4_/0xFx peripheral addresses and
      "ARM-only"; the only hits are the GIC-400 and ARM_LOCAL notes (ARM_LOCAL repeated in a later
      chapter, consistent). None found. Mechanical resolution skipped all locators (printed page numbering);
      hashes checked by sha256sum.'
    contrary_evidence: none-found
    citation_precision: exact
    readers:
    - verifier: Claude Code subagent, claude-opus-5-5, Claude Code, session docs-r2
      verdict: PASS
      date: '2026-10-14'
      note: 'Datasheet 1.2.1 (p.4) names a Full 35-bit bus and a 32-bit Legacy Master view seen by
        peripherals except large-address masters; 1.2.2 (p.5) says the full map is seen by large-address
        masters such as DMA4 and by the ARM CPU; 1.2.3 (p.6) gives Main 0x4_7C00_0000-0x4_7FFF_FFFF
        and ARM Local 0x4_C000_0000-0x4_FFFF_FFFF, and in Low Peripheral mode (enabled by the VPU)
        the ARM only sees Main at 0x0_FC00_0000-0x0_FF7F_FFFF and ARM Local at 0x0_FF80_0000-0x0_FFFF_FFFF;
        1.2.4 (p.6) says document addresses are legacy and gives the 0x7Enn_nnnn -> 0x4_7Enn_nnnn
        / 0x0_FEnn_nnnn translation. 6.5.1/6.5.2 (p.92) state GIC-400 and ARM_LOCAL bases are ARM-only,
        not legacy. 11.5 (p.147) lists UART0 at 0x7e201000. "The other DMA masters" paraphrases the
        datasheet''s "peripherals (except large address masters)" together with 1.2.4''s rule that
        DMA engines use legacy addresses; acceptable. pages [4,6] is a range and covers 1.2.1-1.2.4.
        Contrary search: grepped the whole PDF text for every hex address outside the 0x7C-0x7F legacy
        window and for "ARM-only"/"not a legacy"; only the GIC-400 and ARM_LOCAL bases (and figure/RAM-window
        values) appeared, so no further non-legacy peripheral address was found.'
  dma-view-of-memory:
    basis: 29fa21399883ab4175a334a830594aac519a8f69f57c5a501ad8cb48bd328df1
    verdict: PASS
    date: '2026-10-14'
    verifier: Claude Code subagent, claude-opus-5-5, Claude Code, session docs-p1
    note: '1.2.4 (p6): DMA access to RAM uses legacy 0xC000_0000-0xFFFF_FFFF, a 1 GB window movable
      with PAGE/PAGELITE; L2 aliases at 0x0000_0000 (allocating) and 0x8000_0000 (non-allocating)
      are fixed and limited to the first 1 GB; Main peripherals at 0x7C00_0000-0x7FFF_FFFF. Table
      62 (p60): ENABLE.PAGELITE bits 31:28 for DMA Lite DMA7-10, PAGE bits 27:24 for the 30-bit engines
      DMA0-6, one field each (per group). 4.6 (p64): DMA4 engines access the full 35-bit bus and bypass
      the paging registers. 4.2 (p31): channel 15 at 0x7ee05000, physically apart, used exclusively
      by the VPU. Contrary search: chapter 4 overview (16 channels, 4 Lite, 4 DMA4), DMA Lite register
      map (channels 7-10 labeled Lite), and 4.1''s note that DMA uses legacy peripheral addresses;
      consistent, none found.'
    contrary_evidence: none-found
    citation_precision: exact
  stub-load-and-hand-off-words:
    basis: 7c849b6f710f2e0c4e72f86c1e60e925a23b24689c489eb61be8c659e71a6ff3
    verdict: PASS
    date: '2026-10-14'
    verifier: Claude Code subagent, claude-opus-5-5, Claude Code, session docs-p1
    note: 'tfa-rpi4 at the pin, section "TF-A port design": if armstub8.bin is found or armstub= names
      a file, it is loaded to the beginning of DRAM (address 0) and executed in AArch64 EL3; the kernel
      and device tree are loaded first, and if the GPU firmware finds a magic value in the armstub
      image it puts the two load addresses in memory locations near the beginning of memory where
      TF-A picks them up. The claim matches this in scope; it avoids TF-A''s naming of bootcode.bin
      as the loader. Contrary search: pinned rpi-docs config_txt/boot.adoc `armstub` (default stub
      is in firmware, armstub names a file on the boot partition) and legacy_config_txt/boot.adoc
      (kernel_address/kernel_old and the arm_peri_high note); no conflict, though no Raspberry Pi
      document at the pin restates the default armstub8.bin filename or the EL3 entry, so those rest
      on the TF-A document alone (a third-party doc). TODO (hardware) for the word offsets is observable
      by a stub that dumps low memory; it covers only the unsupported offsets, not the supported part.'
    contrary_evidence: none-found
    citation_precision: exact
    readers:
    - verifier: Claude Code subagent, claude-opus-5-5, Claude Code, session docs-r2
      verdict: PASS
      date: '2026-10-14'
      note: 'tfa-rpi4 at the pin, heading "TF-A port design": bootcode.bin loads armstub8.bin, or
        the file named by armstub=, to the beginning of DRAM (address 0) and executes it in AArch64
        EL3; it also loads a kernel and device tree, and if the GPU firmware finds a magic value in
        the armstub image it puts those two load addresses in memory locations near the beginning
        of memory, where TF-A picks them up. The claim''s "where the stub reads them" generalizes
        TF-A to the stub role, which the passage describes TF-A as occupying. Contrary search: rpi-docs
        config_txt/boot.adoc "armstub" (default stub is built into firmware and selected automatically;
        consistent, the claim is scoped to a stub file) and legacy boot.adoc kernel_address/kernel_old
        (load addresses only); nothing conflicting. The TODO (offsets of the words, by hardware) is
        a feasible check: memory near 0 can be inspected after the firmware hands off; it is not performed.'
  kernel-entry-contract-linux-s-requirements:
    basis: d60664b13712d56abafa44823da7de4f183d495fd725d2bf21cebf01b5cdcff1
    verdict: PASS
    date: '2026-10-11'
    verifier: Claude Code, claude-sonnet-5-5, reader headings-r2-primary
    note: 'Headings "2. Setup the device tree" and "4. Call the kernel image" exist at the pin as
      section titles. Section 2: dtb on an 8-byte boundary, at most 2 MB. Section 4: x0 = dtb physical
      address and x1-x3 = 0; all DAIF masked; non-secure EL2 (RECOMMENDED) or EL1; MMU off; no stale
      icache entries; image range cleaned to PoC; DMA-capable devices quiesced; CNTFRQ programmed,
      CNTVOFF consistent, and CNTHCTL_EL2.EL1PCTEN set when entering at EL1; same coherency domain;
      all CPUs enter at the same exception level; Image at text_offset from a 2MB aligned base with
      image_size bytes free from the Image start. Clause "System registers" is a bullet label inside
      section 4 (not a heading): SCR_EL3.FIQ equal across CPUs and unchanged at runtime, SCR_EL3.HCE
      = 1 for EL2 entry with EL3 present, set by software at a higher exception level. Every part
      of the claim is supported, including the "not observations of stock firmware" scope statement,
      which the TODO keeps open. Contrary-evidence search covered the whole of booting.rst at the
      pin: qualifications (image_size zero with text_offset 0x80000 for pre-v3.17 images; DTB placement
      note for pre-v4.2; traps may be enabled if handled transparently; EL1-only/feature- conditioned
      register requirements) none contradicts the claim as worded; the claim is scoped to Linux v7.2
      text and the generic list. Not searched beyond this document (no errata or other Linux docs).
      Precision: the three locators cover the dtb, entry state and system-registers parts; the duplicate
      section-4 locator is redundant but harmless, and the "System registers" clause is findable by
      its bullet label. Items such as the 8-byte alignment and text_offset placement sit in sections
      2 and 4 respectively, which are cited. Standard document without pages, so headings suffice.'
    contrary_evidence: none-found
    citation_precision: exact
    readers:
    - verifier: Claude Code, claude-opus-5-5, reader headings-r2-second
      verdict: PASS
      date: '2026-10-11'
      note: 'Fetched Documentation/arch/arm64/booting.rst at linux 8d3ae59288f1e7d58d76558a6ee96d533bc5019f
        (620 lines, sha256 4312d0ef56380dfedd0e2ed0f4375d158e006affbba269877347b0b1b0b55ea0; the document
        entry pins no sha256, so no hash comparison). spec.py resolve reported 0 anchors resolved,
        0 skipped (heading locators are not machine-checked; two unrelated errors for missing pl011-trm
        and cortex-a72-trm files), so all locators were checked by reading. Heading "2. Setup the
        device tree" exists and states the 8-byte boundary and 2 MB maximum. Heading "4. Call the
        kernel image" exists and states: Image at text_offset from a 2MB aligned base with image_size
        bytes free from the image start; quiesce DMA-capable devices; primary x0 = dtb physical address,
        x1-x3 = 0; all DAIF masked; non-secure EL2 (recommended) or EL1; MMU off, I-cache no stale
        entries, image cleaned to PoC; CNTFRQ programmed, CNTVOFF consistent on all CPUs, CNTHCTL_EL2.EL1PCTEN
        set on EL1 entry ("where available", a qualifier the claim drops; harmless on Cortex-A72,
        which has EL2); all CPUs in the same coherency domain; and, after the System registers clause,
        that these requirements apply to all CPUs and all CPUs enter at the same exception level.
        Clause "System registers" exists in section 4 and states the registers are initialised by
        software at a higher exception level, SCR_EL3.FIQ the same across CPUs and unchanged from
        boot while the kernel runs, and SCR_EL3.HCE = 1 for EL2 entry with EL3 present. The claim
        is scoped as Linux''s rules, not firmware observations, which matches the source; the hardware
        TODO about the stock stub''s handover state is a legitimate open question a hardware check
        can observe. Contrary-evidence search: read all of booting.rst at the pin (sections 1-4, header
        notes, version NOTEs for pre-v4.2 dtb and pre-v4.6 image placement, the GICv3/GICv5 and feature-conditional
        register lists, and the secondary-CPU and enable-method text). None contradicts the claim;
        the omitted conditional register requirements (GICv3/v5, FEAT_*) are conditional on features
        and do not make the listed subset wrong, since the claim does not say the list is complete
