      Mailboxes "Mailbox registers" gives mailbox 0 read 0x00 and status 0x18, mailbox 1 write 0x20
      and status 0x38, and says MB0 is VC to ARM, MB1 ARM to VC. Mailbox property interface preamble:
      28-bit value MSB plus 4-bit channel LSB, 16-byte aligned buffer, response overwrites request,
      buffer layout (size, request code 0, tags, end tag 0, padding), response code 0x80000000 success,
      tag format with response bit b31 and length in b30-b0, padding to 32 bits, host CPU byte order.
      Accessing mailboxes: general procedure and the exception that the property channel takes physical
      addresses. All stated in the claim. Contrary evidence found, not changing the verdict because
      the claim matches its cited wiki: the Linux v7.2 driver passes the property buffer''s DMA address
      (drivers/firmware/raspberrypi.c rpi_firmware_property_list: dma_alloc_coherent then rpi_firmware_transaction
      with bus_addr, lines 100-114), and bcm2711.dtsi (arch/arm/boot/dts/broadcom, line 45) defines
      the soc dma-ranges as bus 0xc0000000 to CPU 0x0, so on BCM2711 Linux sends the 0xC0000000-alias
      bus address, not the plain physical one. The wiki''s "physical address" statement (a draft page
      covering all Raspberry Pis) may be loose for this chip; consider a TODO to confirm which address
      space the Pi 4 firmware requires. The page''s example addresses are for older chips and are
      not cited.'
