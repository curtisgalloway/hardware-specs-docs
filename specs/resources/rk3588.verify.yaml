  psci-not-documented:
    basis: 08c10c669ea9ce477eec56a1ab72131d657dad889347706b303c6116ea744524
    verdict: GAP
    date: '2026-10-09'
    verifier: Claude Code, claude-sonnet-5-5, reader rock5t-r2-primary-docs
    note: 'The SMC call of PSCI_VERSION from the EL2 shim, PSCI_FEATURES and the device tree ''method''
      property can settle version and advertised conduit. Advisory: an HVC from EL1 is taken by the
      EL2 software that is the shim itself, so it cannot show that firmware refuses HVC; the conclusion
      should rest on the SMC result and the method property. Mode: full reading. Gap fact (no support,
      TODO). Contrary evidence for a supported value was not checked because there is none; the claim
      is scoped to documents read for this base, and its only declared document is the GIC-600 TRM,
      which is generic and names no SoC. Citation precision is imprecise because nothing is cited.'
    contrary_evidence: not-checked
    citation_precision: imprecise
    readers:
    - verifier: Claude Code, claude-opus-5-5, reader rock5t-r2-second
      verdict: GAP
      date: 2026-10-09
      note: FULL reading. No support; a gap fact. PSCI_VERSION and PSCI_FEATURES over SMC settle the
        version and SMC conduit. The HVC attempt from EL1 traps to the kernel shim's own EL2 when
        the kernel enters at EL2, so it tests the shim, not firmware; drop it or restrict it to an
        EL1 entry. Precision imprecise and contrary evidence not checked (no citation).
