      verdict: GAP
      date: 2026-10-09
      note: 'FULL reading. No support; a gap fact. The CNTFRQ and external-reference timing parts
        of the TODO can observe the frequency. The interrupt-ID part is weak: GICR_ICFGR1 shows configured
        trigger type (ICFGR0 covers SGIs only) and comparing with BSA recommendations assumes the
        integrator followed them; to observe the IDs, arm each timer with a short TVAL and read GICR_ISPENDR0.
        Precision imprecise and contrary evidence not checked (no citation).'
