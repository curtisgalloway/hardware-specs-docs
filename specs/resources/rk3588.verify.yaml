    note: 'Deficiency for the author: the frequency half of the TODO is sound (CNTFRQ_EL0 read plus
      an independent-clock timing check). The interrupt-ID half is not: reading GICR_ICFGR0/1 and
      comparing with the recommended PPI assignment shows trigger configuration of each PPI number,
      not which PPI number each timer raises, so the IDs would be assumed from the recommendation.
      Proposed addition, matching the interrupt-map TODO: arm each timer with its interrupt masked
      at the GIC and read GICR_ISPENDR0 to find the pending PPI bit, then read GICR_ICFGR1 for its
      trigger. Mode: full reading. Gap fact (no support, TODO). Contrary evidence for a supported
      value was not checked because there is none; the claim is scoped to documents read for this
      base, and its only declared document is the GIC-600 TRM, which is generic and names no SoC.
      Citation precision is imprecise because nothing is cited.'
    contrary_evidence: not-checked
