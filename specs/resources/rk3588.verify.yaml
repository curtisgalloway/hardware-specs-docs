  gic600-register-pages:
    basis: 8877267e5a9fec4e4bab2a6979c93611416dc73b3447bea15a0fff84b58a1272
    verdict: PASS
    date: 2026-10-09
    verifier: Claude Code, claude-sonnet-5-5, reader rock5t-primary-docs-rk3588
    note: 'Fetched the GIC-600 TRM (100336_0106_00_en) from the declared documentation-service URL;
      sha256 matches the declared value and the PDF has 216 pages. Section 4.1.1 and Table 4-1 (printed
      pages 4-103 and 4-104) list Offset[x:16] page indices: GICD 0, GICA 1, GICT 2, GICP 3, GITSn
      4+(ITSnum x 2), GITSn translate 5+(ITSnum x 2), GICR LPI 4+(2 x ITScount)+(RDnum x 2), GICR
      SGI 5+(2 x ITScount)+(RDnum x 2), GICDA 4+(2 x ITScount)+(RDcount x 2) "page after last GICR
      page", and RDcount equals the number of CPU cores. These match the claim, and the derived start
      (4+2k) x 0x1_0000 with a 2-page (128 KB) redistributor stride follows arithmetically. The "64
      KB" page size is implied by the Offset[x:16] notation (page index is address bit 16 and up);
      the TRM text does not state "64 KB" in words, which is a minor gap in explicitness only. Contrary-evidence
      search covered the whole TRM text (section 4.1.2 discovery, the multichip operation section
      3.17, GICR_TYPER and virtual-LPI feature bits): section 4.1.2 says GIC-600 has two pages per
      redistributor because it does not support virtual LPIs, which agrees with the claim''s stride.
      Multichip systems add chip_id in ProcessorNumber but the page layout is unchanged; no conflicting
      layout found. The claim''s "in any GIC-600" holds for the layout given the TRM describes the
      single product; the TRM revision r1p6 is the one cited. The "resolve" tool reports 0 anchors
      for this databook-only spec, so there is no machine anchor; the reading was done by hand.'
    contrary_evidence: none-found
    citation_precision: exact
    readers:
    - verifier: Claude Code, claude-opus-5-5, reader rock5t-second-docs
      verdict: PASS
      date: 2026-10-09
      note: 'gic600-trm fetched from the documentation-service retrieval URL; sha256 matches the declared
        value; document marked Non-Confidential (issue 0106-00, r1p6). Section 4.1.1, Table 4-1, pages
        4-103 and 4-104: page index is Offset[x:16] (64 KB pages); GICD 0, GICA 1, GICT 2, GICP 3,
        GITSn 4+2n and translate 5+2n, GICR LPI 4+2*ITScount+2*RDnum and SGI page 5+..., GICDA after
        the last GICR page; the note gives RDcount equal to the number of CPU cores. The closing base
        + (4+2k)*0x1_0000 at a 128 KB stride is arithmetic on the table, not a separate inference.
        Contrary-evidence search (sections 4.1.2 Discovery, the introduction''s Redistributor description,
        GICD_CFGID 4.2.11): none found; section 4.1.2 notes that in a multichip configuration each
        chip has its own first Redistributor page, so "from the GIC base" is per chip, which does
        not contradict the claim. Citation precision exact.'
  gic-instance:
    basis: 36efed6661b6cc2cb9acab4f3ff0db09d572f6bfa9e40daea5c3aa18624be0ef
    verdict: GAP
    date: '2026-10-09'
    verifier: Claude Code, claude-sonnet-5-5, reader rock5t-r2-primary-docs
    note: 'TRM r1p6 (printed pages 4-103 to 4-104, 4-111, 4-120) is generic: GICD_IIDR gives product
      ID 0x2 and variant/revision (r/p); GICD_CFGID has no ITS count; ITS and redistributor page positions
      follow the layout table. The TODO method can settle revision (GICD_IIDR) and redistributor count
      (GICR_TYPER.Last). It does not read ITS registers; ITS count is derivable only from the confirmed
      redistributor frame offset ((offset/64KB - 4)/2, per the TRM''s register-map table) or by probing
      GITS pages 4+2n. Suggest the TODO say so. Mode: full reading. Gap fact (no support, TODO). Contrary
      evidence for a supported value was not checked because there is none; the claim is scoped to
      documents read for this base, and its only declared document is the GIC-600 TRM, which is generic
      and names no SoC. Citation precision is imprecise because nothing is cited.'
    contrary_evidence: not-checked
    citation_precision: imprecise
    readers:
    - verifier: Claude Code, claude-opus-5-5, reader rock5t-r2-second
      verdict: GAP
      date: 2026-10-09
      note: 'FULL reading. No support; a gap fact. The TODO can settle base, revision and redistributor
        count (GICD_IIDR, GICD_TYPER, GICR_TYPER.Last walk), but none of the listed registers reports
        the ITS count: GIC-600 TRM r1p6 section 4.2.11 Table 4-14 (GICD_CFGID, page 4-120) has no
        ITS field. Add to the method: probe GITS_IIDR at pages 4 + 2n, or infer k from the first GICR
        frame offset via Table 4-1. Citation precision imprecise and contrary evidence not checked
        because there is no citation or value.'
