orientation: >-
  The Radxa ROCK 5T is an RK3588 board with 64-bit LPDDR5, onboard eMMC, SPI NOR flash, a
  microSD slot, two M.2 M-key PCIe 3.0 slots and two 2.5 GbE ports. This spec covers what a
  first bring-up needs: the debug console, the boot chain and kernel entry, boot media and the
  ROM's boot order, and Maskrom recovery. It rests only on Radxa's and U-Boot's documents and
  the Linux boot protocol; the Linux, device-tree and U-Boot source view is the GPL overlay in
  hardware-specs-gpl. The schematic read is V1.2; the ROCK 5T Industrial (V2.01) is not covered.
assumptions:
  - id: shipped-loader-is-bsp-build
    text: >-
      the loader on a factory-flashed ROCK 5T is the U-Boot Radxa's BSP tool builds for the
      `rock-5t` product, not a different build
    todo:
      check: hardware
      text: read the version banner the loader prints on the console of a factory-flashed board.
facts:
  - id: cpu-complex
    section: quick-facts
    title: SoC and CPU complex
    claim: >-
      The ROCK 5T carries a Rockchip RK3588 or RK3588J with four Cortex-A76 cores (2.2 or 2.4 GHz)
      and four Cortex-A55 cores (1.8 GHz) in an Arm DynamIQ configuration.
    support:
      - class: doc
        doc: rock5t-product-brief
        at: [{section: "3.1", page: "4"}]
    todo:
      check: document
      text: which SKUs carry the RK3588J (industrial grade) is not stated; check the order information and Radxa's Industrial variant documents.

  - id: debug-console
    section: quick-facts
    title: Debug console
    critical: true
    claim: >-
      The debug console is on the 40-pin header: pin 8 is TX, pin 10 is RX, pin 6 is ground, at
      1500000 baud, 8N1, no flow control. Radxa warns that some CP210x and PL2303 adapters cannot
      run at 1.5 Mbaud and that some FT232RL adapters cause power problems.
    support:
      - class: doc
        doc: radxa-docs-serial
        at:
          - {heading: opening paragraph}
          - {heading: Preparation}
          - {heading: Serial Connection}

  - id: debug-console-is-uart2-m0
    section: quick-facts
    title: The console pins are UART2 M0
    critical: true
    claim: >-
      Header pin 8 is SoC pin GPIO0_B5 (UART2_TX_M0) and pin 10 is GPIO0_B6 (UART2_RX_M0), each
      through a 100 Ω series resistor (R442, R443). So the console is
      UART2 with its M0 pin multiplexing.
    support:
      - class: doc
        doc: rock5t-schematic
        at: [{page: "36", heading: 40pin/LED/RTC/EEPROM}]
      - class: doc
        doc: rock5t-product-brief
        at: [{section: "6.1.1", page: "8"}]
    relates:
      - {fact: "#debug-console", relation: qualifies}
      - {fact: "rk3588#uart2-pinmux", relation: qualifies}

  - id: uart2-state-at-handoff
    section: quick-facts
    title: UART2 state the firmware leaves
    critical: true
    claim: >-
      Whether the stock firmware leaves UART2's M0 pin multiplexing set, its baud clock running
      and its divisor programmed for 1500000 baud at kernel entry, so that polled transmit writes
      work without touching the clock or pin controllers, is not stated by any document read here.
    todo:
      check: hardware
      text: >-
        at kernel entry, write a byte to UART2's transmit register without other setup and watch
        the header; then read back the pin multiplexing and divisor registers the GPL overlay
        names. Run the byte test twice, once under the stock loader and once under mainline
        U-Boot, because the claim is about the stock firmware and the state differs between them.
    relates:
      - {fact: "rk3588#uart2-pinmux", relation: qualifies}

  - id: stock-loader
    section: quick-facts
    title: Radxa's BSP builds the ROCK 5T U-Boot from the rk2410 profile
    critical: true
    claim: >-
      Radxa's shared U-Boot page lists `rock-5t` with the `rk2410` profile, as it does `rock-5b`;
      its worked example, for the ROCK 5B, builds a package named
      `u-boot-rk2410_2017.09-999_arm64.deb`. The ROCK 5T wrapper page passes the profile
      `rknext` to that shared page, which does not read the property; Radxa's pages do not
      explain the difference.
    support:
      - class: doc
        doc: radxa-docs-uboot
        at: [{heading: Build U-Boot}]
      - class: doc
        doc: radxa-docs-rock5t-uboot
        at: [{heading: U-boot Development}]
    todo:
      check: hardware
      text: read the version banner on the console of a factory-flashed board.

  - id: stock-loader-is-2017-vendor-build
    section: quick-facts
    title: The stock loader is a 2017.09-based vendor U-Boot
    critical: true
    claim: >-
      The loader on a factory-flashed ROCK 5T is a vendor U-Boot with a 2017.09 base, not
      mainline U-Boot.
    support:
      - class: inference
        confidence: medium
        premises:
          - fact: "#stock-loader"
            uses: the rock-5t row's rk2410 profile and the 2017.09 package name
          - assumption: shipped-loader-is-bsp-build
        derivation: >-
          the rk2410 profile builds a package whose version field is 2017.09, which names the
          U-Boot base version; if the shipped loader is that build, it has a 2017.09 base and is
          therefore not mainline. The wrapper's unexplained `rknext` profile weakens the
          premise.
    todo:
      check: hardware
      text: read the version banner on the console of a factory-flashed board.
    assumes: [shipped-loader-is-bsp-build]

  - id: mainline-boot-chain
    section: quick-facts
    title: Mainline boot chain
    claim: >-
      Mainline U-Boot supports the ROCK 5T through the `rock5b-rk3588` configuration (it lists
      "Radxa ROCK 5B/5B+/5T"). An arm64 Rockchip image needs a BL31 (built from TF-A or, in the page's rk3588 example,
      Rockchip's `rkbin` binary); where U-Boot cannot
      initialize DRAM, Rockchip's DDR binary from `rkbin` is packaged as the TPL. The single
      `u-boot-rockchip.bin` image is written at sector 64 of an SD card, and
      `u-boot-rockchip-spi.bin` at offset 0 of SPI flash.
    support:
      - class: doc
        doc: uboot-docs-rockchip
        at:
          - {heading: Rockchip boards}
          - {heading: TF-A}
          - {heading: TPL}
          - {heading: U-Boot}
          - {heading: Package the image with U-Boot TPL/SPL}
    todo:
      check: source
      text: the contents of `u-boot-rockchip.bin` and the order its stages run are not stated by the page; confirm which stages run and in what order on the console of a mainline boot.

  - id: kernel-entry-contract
    section: quick-facts
    title: Kernel entry contract
    critical: true
    claim: >-
      An arm64 loader enters the kernel with `x0` = the physical address of the device tree,
      `x1`–`x3` = 0, all of DAIF masked, the MMU off, in non-secure EL2 (recommended) or EL1, with
      CNTFRQ programmed and CNTVOFF consistent on all CPUs. Which exception level the ROCK 5T's
      stock loader actually uses is not stated by the documents read here.
    support:
      - class: standard
        doc: linux-booting
        at:
          - {heading: 4. Call the kernel image}
    todo:
      check: hardware
      text: read CurrentEL in the kernel shim's first instructions under the stock loader and under mainline U-Boot.

  - id: kernel-image-format
    section: quick-facts
    title: Kernel image format and placement
    critical: true
    claim: >-
      U-Boot's `booti` boots an arm64 `Image`, flat or compressed (compressed needs
      `kernel_comp_addr_r` and `kernel_comp_size` set); without an address it uses
      `CONFIG_SYS_LOAD_ADDR`. The Image must sit `text_offset` bytes above a 2 MB-aligned base in
      usable RAM with `image_size` bytes free; the device tree must be 8-byte aligned and at most
      2 MB. Where the stock loader loads the kernel by default is not stated by the documents
      read here.
    support:
      - class: doc
        doc: uboot-docs-booti
        at: [{heading: Description}]
      - class: standard
        doc: linux-booting
        at:
          - {heading: 2. Setup the device tree}
          - {heading: 4. Call the kernel image}
    todo:
      check: hardware
      text: print the stock loader's environment (kernel_addr_r, fdt_addr_r) on the console.

  - id: ram-options
    section: quick-facts
    title: RAM options
    claim: >-
      64-bit LPDDR5 in 4, 8, 16, 24 or 32 GB (order codes D4 to D32), as two 32-bit channels.
    support:
      - class: doc
        doc: rock5t-product-brief
        at:
          - {section: "3.1", page: "4"}
          - {section: "7", page: "11"}
      - class: doc
        doc: rock5t-schematic
        at: [{page: "15", heading: LPDDR5_315P_2X32bit}]

  - id: ram-map-and-reservations
    section: quick-facts
    title: RAM map and firmware reservations
    critical: true
    claim: >-
      Where each RAM size appears in the physical map, and which ranges the boot firmware (BL31,
      OP-TEE if present) reserves or writes outside its reservations, is not stated by any
      document read here; see `rk3588#address-map`.
    todo:
      check: hardware
      text: >-
        dump the memory node and reserved-memory and memreserve entries of the device tree the
        stock loader passes, for each RAM size available. This settles which ranges are declared
        reserved; it cannot show what BL31 or OP-TEE write outside their reservations, which needs
        the firmware's own documentation or source, so that clause of the claim stays unknown.
    relates:
      - {fact: "rk3588#address-map", relation: qualifies}

  - id: boot-order-strap
    section: quick-facts
    title: Boot order strap
    critical: true
    claim: >-
      The boot ROM reads the boot mode from SARADC input 0 (`BOOT_SARADC_IN0`). On the ROCK 5T it
      is pulled to 1.8 V by R1511 (100 kΩ) with the pull-down R1509 not fitted, which the
      schematic's table names level 7: the ROM tries FSPI M2, FSPI M1, FSPI M0, eMMC, SD card,
      then USB.
    support:
      - class: doc
        doc: rock5t-schematic
        at: [{page: "13", heading: BOOT MODE CONFIG}]

  - id: maskrom-strap
    section: quick-facts
    title: Maskrom button
    critical: true
    claim: >-
      The Maskrom button (SW1) shorts `BOOT_SARADC_IN0` to ground, which the schematic's table
      names level 1, "USB (Maskrom mode)": held at power-on, the ROM skips storage and waits for
      code over USB.
    support:
      - class: doc
        doc: rock5t-schematic
        at: [{page: "13", heading: BOOT MODE CONFIG}]
      - class: doc
        doc: rock5t-product-brief
        at: [{section: "3.2", page: "5"}]

  - id: maskrom-recovery
    section: quick-facts
    title: Maskrom recovery with rkdeveloptool
    claim: >-
      To enter Maskrom: remove the microSD card and power, hold the Maskrom button, connect the
      Type-C port to the host and power the board. Then `rkdeveloptool db <loader>` loads
      Rockchip's SPL loader (`rk3588_spl_loader_….bin`), `rkdeveloptool wl 0 <image>` writes an
      uncompressed image from sector 0 of the one storage device it finds, and `rkdeveloptool rd`
      resets. rkdeveloptool cannot choose which device or which medium it writes.
    support:
      - class: doc
        doc: radxa-docs-maskrom-linux
        at: [{heading: Enter to Maskrom}]
      - class: doc
        doc: radxa-docs-rkdeveloptool
        at:
          - {heading: Using rkdeveloptool}
          - {heading: Reboot}

  - id: boot-storage
    section: quick-facts
    title: Boot storage
    critical: true
    claim: >-
      Four storage media, of which the boot ROM reads three (see `#boot-order-strap`): an SPI NOR
      flash (part XT25F128B, 3.3 V) on the FSPI signals; an onboard 8-bit eMMC (BGA-153, with a
      data strobe wired; 16 to 256 GB in the product brief's section 3.1, whose section 7 order
      codes list E0, not fitted, to E128) on the eMMC controller; a microSD slot on SDMMC0 with
      card detect; and two M.2 M-key slots with PCIe 3.0 x2 each for NVMe, which the schematic's
      boot-mode table does not list among the boot ROM's devices.
    support:
      - class: doc
        doc: rock5t-schematic
        at:
          - {page: "13", heading: BOOT MODE CONFIG}
          - {page: "21", heading: SPI/eMMC Flash}
          - {page: "9", heading: RK3588_Flash/SD Controller}
          - {page: "29", heading: Flash-TF Card/DMIC}
          - {page: "24", heading: PCIE3.0 M key X2}
      - class: doc
        doc: rock5t-product-brief
        at:
          - {section: "3.1", page: "4"}
          - {section: "3.2", page: "5"}
          - {section: "7", page: "11"}
    relates:
      - {fact: "#boot-order-strap", relation: qualifies}
    todo:
      check: document
      text: the SPI flash's capacity and the eMMC bus mode (HS400) are not stated by the schematic or brief pages cited; take them from the XTX part's datasheet and the brief's block diagram (schematic sheet 3), or read the JEDEC ID and the eMMC bus speed mode on a board.

  - id: nvme-needs-spi-loader
    section: gotchas
    title: NVMe boot needs the bootloader in SPI flash.
    claim: >-
      To boot from an NVMe SSD, Radxa's procedure first writes the SPI bootloader image to the
      SPI flash (with `rsetup`, from a system booted off microSD), and that bootloader then loads
      the system from NVMe. NVMe is not among the boot ROM's devices in the schematic's boot-mode
      table (see the boot order strap).
    support:
      - class: doc
        doc: radxa-docs-nvme
        at:
          - {heading: Overall Steps}
          - {heading: Using System Tool rsetup to Flash SPI}
    relates:
      - {fact: "#boot-order-strap", relation: qualifies}

  - id: ethernet
    section: quick-facts
    title: Ethernet
    claim: >-
      Two 2.5 GbE ports, each a Realtek RTL8125B on its own PCIe 2.0 x1 lane (`PCIE20_0` and
      `PCIE20_2`). One port takes an optional PoE module.
    support:
      - class: doc
        doc: rock5t-schematic
        at:
          - {page: "25", heading: PCIE TO RJ45_1}
          - {page: "26", heading: PCIE TO RJ45_2}
      - class: doc
        doc: rock5t-product-brief
        at: [{section: "6.2", page: "9"}]

  - id: netboot-stock-loader
    section: gotchas
    title: Netboot with the stock loader is unconfirmed.
    claim: >-
      No document read here says whether the stock loader can bring up PCIe and drive the
      RTL8125B to fetch a kernel over TFTP or PXE, or offers fastboot over USB or TCP.
    todo:
      check: hardware
      text: >-
        on the stock loader's console, list commands (help) and try `pci enum`, `dhcp` and `pxe
        get` with a cable in each port. The command listing only shows whether a fastboot command
        exists, not that it works: to settle fastboot, run it over USB and over TCP. The stock
        loader is a 2017.09-based build and may name its commands differently, so read its help
        output rather than assuming mainline names.
